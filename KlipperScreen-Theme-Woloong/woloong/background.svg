<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep space gradient - near black with subtle blue undertone matching Logo inner shadow #212830 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0d0d14"/>
      <stop offset="40%" stop-color="#08080c"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    
    <!-- Red glow filter for brand accent -->
    <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Cyan glow for tech contrast (minimal use) -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Hexagon grid pattern - Woloong Logo motif -->
    <pattern id="hexGrid" width="48" height="41.57" patternUnits="userSpaceOnUse" patternTransform="scale(1.3)">
      <path d="M24 0 L48 12 L48 36 L24 48 L0 36 L0 12 Z" 
            fill="none" stroke="#ff0000" stroke-width="0.25" opacity="0.035"/>
    </pattern>
    
    <!-- Subtle dot grid for precision feel -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.6" fill="#ff0000" opacity="0.025"/>
    </pattern>
  </defs>
  
  <!-- Base background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  
  <!-- Hex grid overlay - Woloong brand identity -->
  <rect width="800" height="480" fill="url(#hexGrid)"/>
  
  <!-- Dot grid for precision -->
  <rect width="800" height="480" fill="url(#dotGrid)"/>
  
  <!-- Subtle horizontal reference lines - engineering blueprint feel -->
  <g opacity="0.04" stroke="#ff0000" stroke-width="0.8">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
  </g>
  
  <!-- Vertical reference lines -->
  <g opacity="0.04" stroke="#ff0000" stroke-width="0.8">
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
  </g>
  
  <!-- ════════════════════════════════════════ -->
  <!-- TOP-LEFT Corner: Hexagon + bracket tech decoration -->
  <!-- ════════════════════════════════════════ -->
  <g opacity="0.5" filter="url(#glowRed)">
    <!-- Hexagon corner frame -->
    <path d="M10 30 L30 20 L50 30 L50 50 L30 60 L10 50 Z" 
          fill="none" stroke="#ff0000" stroke-width="0.8" opacity="0.3"/>
    <!-- Outer L-bracket -->
    <path d="M0 35 L35 35 L35 0" fill="none" stroke="#ff0000" stroke-width="1.2"/>
    <!-- Inner accent dot -->
    <circle cx="35" cy="35" r="2.5" fill="#ff0000" opacity="0.6"/>
    <!-- Small hexagon accent -->
    <path d="M35 35 L38 32 L41 35 L38 38 Z" 
          fill="none" stroke="#ff0000" stroke-width="0.5" opacity="0.5"/>
    <!-- Reference tick marks -->
    <line x1="0" y1="50" x2="20" y2="50" stroke="#ff0000" stroke-width="0.5" opacity="0.3"/>
    <line x1="50" y1="0" x2="50" y2="20" stroke="#ff0000" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- ════════════════════════════════════════ -->
  <!-- TOP-RIGHT Corner -->
  <!-- ════════════════════════════════════════ -->
  <g opacity="0.5" filter="url(#glowRed)">
    <path d="M750 30 L770 20 L790 30 L790 50 L770 60 L750 50 Z" 
          fill="none" stroke="#ff0000" stroke-width="0.8" opacity="0.3"/>
    <path d="M800 35 L765 35 L765 0" fill="none" stroke="#ff0000" stroke-width="1.2"/>
    <circle cx="765" cy="35" r="2.5" fill="#ff0000" opacity="0.6"/>
    <path d="M765 35 L768 32 L771 35 L768 38 Z" 
          fill="none" stroke="#ff0000" stroke-width="0.5" opacity="0.5"/>
    <line x1="800" y1="50" x2="780" y2="50" stroke="#ff0000" stroke-width="0.5" opacity="0.3"/>
    <line x1="750" y1="0" x2="750" y2="20" stroke="#ff0000" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- ════════════════════════════════════════ -->
  <!-- BOTTOM-LEFT Corner -->
  <!-- ════════════════════════════════════════ -->
  <g opacity="0.5" filter="url(#glowRed)">
    <path d="M10 430 L30 420 L50 430 L50 450 L30 460 L10 450 Z" 
          fill="none" stroke="#ff0000" stroke-width="0.8" opacity="0.3"/>
    <path d="M0 445 L35 445 L35 480" fill="none" stroke="#ff0000" stroke-width="1.2"/>
    <circle cx="35" cy="445" r="2.5" fill="#ff0000" opacity="0.6"/>
    <path d="M35 445 L38 442 L41 445 L38 448 Z" 
          fill="none" stroke="#ff0000" stroke-width="0.5" opacity="0.5"/>
    <line x1="0" y1="430" x2="20" y2="430" stroke="#ff0000" stroke-width="0.5" opacity="0.3"/>
    <line x1="50" y1="480" x2="50" y2="460" stroke="#ff0000" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- ════════════════════════════════════════ -->
  <!-- BOTTOM-RIGHT Corner -->
  <!-- ════════════════════════════════════════ -->
  <g opacity="0.5" filter="url(#glowRed)">
    <path d="M750 430 L770 420 L790 430 L790 450 L770 460 L750 450 Z" 
          fill="none" stroke="#ff0000" stroke-width="0.8" opacity="0.3"/>
    <path d="M800 445 L765 445 L765 480" fill="none" stroke="#ff0000" stroke-width="1.2"/>
    <circle cx="765" cy="445" r="2.5" fill="#ff0000" opacity="0.6"/>
    <path d="M765 445 L768 442 L771 445 L768 448 Z" 
          fill="none" stroke="#ff0000" stroke-width="0.5" opacity="0.5"/>
    <line x1="800" y1="430" x2="780" y2="430" stroke="#ff0000" stroke-width="0.5" opacity="0.3"/>
    <line x1="750" y1="480" x2="750" y2="460" stroke="#ff0000" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- ════════════════════════════════════════ -->
  <!-- Center: subtle hexagon crosshair - precision manufacturing feel -->
  <!-- ════════════════════════════════════════ -->
  <g opacity="0.06" stroke="#ff0000" stroke-width="0.6" fill="none">
    <!-- Outer hexagon -->
    <path d="M400 210 L430 225 L430 255 L400 270 L370 255 L370 225 Z"/>
    <!-- Inner hexagon -->
    <path d="M400 225 L415 233 L415 247 L400 255 L385 247 L385 233 Z"/>
    <!-- Center cross -->
    <line x1="400" y1="235" x2="400" y2="245"/>
    <line x1="395" y1="240" x2="405" y2="240"/>
    <!-- Concentric circles -->
    <circle cx="400" cy="240" r="8" stroke-dasharray="2,3"/>
    <circle cx="400" cy="240" r="15" stroke-dasharray="3,5" opacity="0.5"/>
  </g>
  
  <!-- ════════════════════════════════════════ -->
  <!-- Bottom status bar decoration - industrial feel -->
  <!-- ════════════════════════════════════════ -->
  <g opacity="0.12">
    <!-- Main bar line -->
    <rect x="180" y="472" width="440" height="1.5" fill="#ff0000"/>
    <!-- Center highlight -->
    <rect x="350" y="470" width="100" height="3" fill="#ff0000" opacity="0.4" rx="1"/>
    <!-- Tick marks -->
    <rect x="200" y="470" width="2" height="5" fill="#ff0000" opacity="0.3"/>
    <rect x="300" y="470" width="2" height="5" fill="#ff0000" opacity="0.3"/>
    <rect x="500" y="470" width="2" height="5" fill="#ff0000" opacity="0.3"/>
    <rect x="600" y="470" width="2" height="5" fill="#ff0000" opacity="0.3"/>
  </g>
  
  <!-- ════════════════════════════════════════ -->
  <!-- Side accent lines - frame rails -->
  <!-- ════════════════════════════════════════ -->
  <g opacity="0.08" stroke="#ff0000" stroke-width="0.8">
    <line x1="6" y1="80" x2="6" y2="400"/>
    <line x1="794" y1="80" x2="794" y2="400"/>
  </g>
  
  <!-- Small hexagon clusters - scattered brand elements -->
  <g opacity="0.07" fill="none" stroke="#ff0000" stroke-width="0.5">
    <path d="M120 100 L124 97 L128 100 L124 103 Z"/>
    <path d="M680 120 L684 117 L688 120 L684 123 Z"/>
    <path d="M150 380 L154 377 L158 380 L154 383 Z"/>
    <path d="M650 360 L654 357 L658 360 L654 363 Z"/>
  </g>
  
  <!-- ════════════════════════════════════════ -->
  <!-- Vignette for depth - darker edges -->
  <!-- ════════════════════════════════════════ -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="55%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="800" height="480" fill="url(#vignette)"/>
</svg>