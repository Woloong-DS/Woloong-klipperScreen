name: woloong-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: assets
        run: bash woloong-release/tools/verify-assets.sh
      - name: afc installer syntax
        run: bash -n scripts/woloong-afc-install.sh
      - name: afc installer fixtures（首启 / 只读 / cp 失败 / known-bad）
        run: bash tests/test-woloong-afc-install.sh
      - name: python syntax
        run: python3 -m compileall -q afc/extras panels/AFC.py
