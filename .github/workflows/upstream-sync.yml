# ============================================================================
# upstream-sync —— 在上游发布新版本后，把「上游 + woloong 定制」重新叠加并推送
#
# 设计（D20）：不做 git merge；而是「上游树整体替换 → 纯上游 commit → 重放定制 → 定制 commit」。
# 门禁：推送前必须通过 verify-assets（定制资产完整性）；基线漂移时**失败退出**，
#       由人工重锚定（更新 baseline + make-patch + 更新清单哈希）后再重跑本工作流。
# ============================================================================
name: upstream-sync

on:
  # 每周一 03:17 UTC 自动检测上游新发布；有新版则自动重叠加，漂移则开 Issue（确保不漏版本）
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 ref（tag 或分支，例如 v0.4.7）'
        required: true
        type: string
      next_tag:
        description: '合并结果打的新 tag（可留空，例如 woloong-1.1.0）'
        required: false
        default: ''
        type: string
      do_push:
        description: '是否推送到本仓库（false 只做演练）'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  restack:
    runs-on: ubuntu-latest
    steps:
      - name: 检出（含全部历史与 tag）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 git 身份
        run: |
          git config user.name  'woloong-ci'
          git config user.email 'ci@woloong.local'
          git config core.autocrlf false

      - name: 添加上游远端并抓取
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/KlipperScreen/KlipperScreen.git || true
          git fetch upstream --tags --prune
          echo '上游可用 tag（近 5）:'
          git tag --sort=-creatordate | grep -v '^woloong-' | head -5

      - name: 上游版本审计（是否落后、列出全部未吸收版本）
        id: audit
        run: |
          set +e
          bash woloong-release/tools/check-upstream.sh | tee /tmp/audit.txt
          rc=${PIPESTATUS[0]}
          set -e
          LATEST=$(grep '^上游最新' /tmp/audit.txt | awk '{print $NF}')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "0" ]; then echo 'behind=0' >> "$GITHUB_OUTPUT"; else echo 'behind=1' >> "$GITHUB_OUTPUT"; fi

      - name: 无新版本 → 结束
        if: steps.audit.outputs.behind == '0'
        run: echo '发行树已对应上游最新发布，无需动作 ✓'

      - name: 重新叠加（上游树替换 → 重放 woloong 定制）
        id: restack
        run: |
          set -uo pipefail
          ARGS=''
          if [ -n '${{ inputs.next_tag }}' ]; then ARGS="--tag ${{ inputs.next_tag }}"; fi
          REF='${{ inputs.upstream_ref }}'; [ -n "$REF" ] || REF='${{ steps.audit.outputs.latest }}'
          bash woloong-release/tools/fork-sync.sh . --upstream-ref "$REF" $ARGS
          echo '--- 提交形状 ---'
          git log --oneline -4

      - name: 门禁 —— 定制资产完整性（失败则绝不推送）
        if: steps.audit.outputs.behind != '0'
        run: |
          set -euo pipefail
          bash woloong-release/tools/verify-assets.sh

      - name: 推送（可选）
        if: steps.audit.outputs.behind != '0'
        if: ${{ inputs.do_push }}
        run: |
          set -euo pipefail
          git push origin HEAD:main
          if [ -n '${{ inputs.next_tag }}' ]; then git push origin '${{ inputs.next_tag }}'; fi
          echo '已推送：上游 ${{ inputs.upstream_ref }} + woloong 定制'

      - name: 漂移或失败 → 开 Issue（不遗漏，人工重锚定）
        if: failure() && steps.audit.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE='上游发布待吸收（基线漂移，需人工重锚定）'
          BODY=$(printf '上游最新：%s\n\n审计输出：\n```\n%s\n```\n\n处理：更新 woloong-release/baseline/<path> 为新的上游文件 → tools/make-patch.sh 重新生成补丁 → 必要时更新 assets.manifest.tsv 中该文件的哈希 → 提交后重跑本工作流。\n' \
            '${{ steps.audit.outputs.latest }}' "$(cat /tmp/audit.txt 2>/dev/null | tail -40)")
          EXIST=$(gh issue list --state open --search "$TITLE" --json number -q '.[0].number' || true)
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --body "$BODY"
            echo "已追加到既有 Issue #$EXIST"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
